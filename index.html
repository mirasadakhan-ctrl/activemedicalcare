<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Active Medical Care | Dr. Nisa Masood, MD</title>
  <meta name="description" content="Active Medical Care - Board-certified internal medicine physician Dr. Nisa Masood, MD. Serving Fairfax, VA. Book appointments online." />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;




const COLORS = {
  navy: "#0A1628",
  navyLight: "#112240",
  teal: "#0D7377",
  tealLight: "#14A7AC",
  tealPale: "#E8F6F7",
  white: "#FFFFFF",
  offWhite: "#F7F9FC",
  gray100: "#EEF2F7",
  gray300: "#C8D3E0",
  gray500: "#7A8CA0",
  gray700: "#3D4F63",
  red: "#C0392B",
  green: "#1A7A4A",
  greenLight: "#E8F5EE",
};

const styles = `
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { font-family: 'DM Sans', sans-serif; background: ${COLORS.white}; color: ${COLORS.navy}; }

  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(10,22,40,0.97);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    height: 68px;
    display: flex; align-items: center;
    padding: 0 40px;
    justify-content: space-between;
  }
  .nav-logo {
    display: flex; align-items: center; gap: 10px;
    color: white; font-family: 'DM Serif Display', serif;
    font-size: 20px; cursor: pointer;
  }
  .nav-logo-mark {
    width: 36px; height: 36px; background: ${COLORS.teal};
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .nav-links { display: flex; gap: 8px; align-items: center; }
  .nav-link {
    color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 500;
    padding: 8px 14px; border-radius: 6px; cursor: pointer;
    transition: all 0.2s; border: none; background: none;
  }
  .nav-link:hover { color: white; background: rgba(255,255,255,0.08); }
  .nav-link.active { color: white; background: rgba(13,115,119,0.3); }
  .nav-btn {
    background: ${COLORS.teal}; color: white; border: none;
    padding: 9px 20px; border-radius: 8px; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: background 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .nav-btn:hover { background: ${COLORS.tealLight}; }

  .page { padding-top: 68px; min-height: 100vh; }

  /* HOME PAGE */
  .hero {
    background: ${COLORS.navy};
    padding: 100px 80px 80px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(13,115,119,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(13,115,119,0.2); border: 1px solid rgba(13,115,119,0.4);
    color: ${COLORS.tealLight}; font-size: 12px; font-weight: 600;
    letter-spacing: 1.2px; text-transform: uppercase;
    padding: 6px 14px; border-radius: 20px; margin-bottom: 28px;
  }
  .hero h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 58px; color: white; line-height: 1.1;
    max-width: 620px; margin-bottom: 24px;
  }
  .hero h1 em { color: ${COLORS.tealLight}; font-style: italic; }
  .hero-sub {
    color: rgba(255,255,255,0.6); font-size: 18px; line-height: 1.6;
    max-width: 500px; margin-bottom: 44px; font-weight: 300;
  }
  .hero-actions { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn-primary {
    background: ${COLORS.teal}; color: white; border: none;
    padding: 14px 28px; border-radius: 10px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-primary:hover { background: ${COLORS.tealLight}; transform: translateY(-1px); }
  .btn-outline {
    background: transparent; color: white;
    border: 1.5px solid rgba(255,255,255,0.25);
    padding: 14px 28px; border-radius: 10px; font-size: 15px;
    font-weight: 500; cursor: pointer; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-outline:hover { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.05); }

  .hero-stats {
    display: flex; gap: 48px; margin-top: 64px;
    padding-top: 48px; border-top: 1px solid rgba(255,255,255,0.08);
  }
  .stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 36px; color: white;
  }
  .stat-label { color: rgba(255,255,255,0.45); font-size: 13px; margin-top: 2px; }

  .section { padding: 80px 80px; }
  .section-alt { background: ${COLORS.offWhite}; }
  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 38px; color: ${COLORS.navy}; margin-bottom: 12px;
  }
  .section-sub {
    color: ${COLORS.gray500}; font-size: 16px; font-weight: 300;
    margin-bottom: 48px; max-width: 520px; line-height: 1.6;
  }

  .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .service-card {
    background: white; border: 1px solid ${COLORS.gray100};
    border-radius: 16px; padding: 32px;
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .service-card:hover { box-shadow: 0 8px 32px rgba(10,22,40,0.08); transform: translateY(-2px); }
  .service-icon {
    width: 48px; height: 48px; background: ${COLORS.tealPale};
    border-radius: 12px; display: flex; align-items: center;
    justify-content: center; font-size: 22px; margin-bottom: 20px;
  }
  .service-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
  .service-card p { color: ${COLORS.gray500}; font-size: 14px; line-height: 1.6; }

  .team-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .team-card {
    background: white; border: 1px solid ${COLORS.gray100};
    border-radius: 16px; overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .team-card:hover { box-shadow: 0 8px 32px rgba(10,22,40,0.08); }
  .team-avatar {
    height: 180px; background: ${COLORS.navyLight};
    display: flex; align-items: center; justify-content: center;
    font-size: 64px;
  }
  .team-info { padding: 24px; }
  .team-info h3 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .team-info p { color: ${COLORS.teal}; font-size: 13px; font-weight: 500; margin-bottom: 10px; }
  .team-info span { color: ${COLORS.gray500}; font-size: 13px; line-height: 1.5; }

  .hours-block {
    background: ${COLORS.navy}; color: white; border-radius: 20px;
    padding: 48px; max-width: 600px;
  }
  .hours-block h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 28px; margin-bottom: 32px;
    color: white;
  }
  .hours-row {
    display: flex; justify-content: space-between;
    padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 15px;
  }
  .hours-row .day { color: rgba(255,255,255,0.6); }
  .hours-row .time { color: white; font-weight: 500; }
  .hours-row .closed { color: ${COLORS.gray500}; }

  /* BOOKING */
  .booking-container {
    max-width: 720px; margin: 0 auto; padding: 60px 40px;
  }
  .booking-container h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 36px; margin-bottom: 8px;
  }
  .booking-container p { color: ${COLORS.gray500}; margin-bottom: 40px; }
  .form-step {
    background: white; border: 1px solid ${COLORS.gray100};
    border-radius: 20px; padding: 40px; margin-bottom: 24px;
  }
  .form-step h3 {
    font-size: 16px; font-weight: 600; color: ${COLORS.teal};
    text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 24px; font-size: 12px;
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label {
    font-size: 13px; font-weight: 600; color: ${COLORS.gray700};
  }
  .form-group input, .form-group select, .form-group textarea {
    border: 1.5px solid ${COLORS.gray300}; border-radius: 10px;
    padding: 12px 16px; font-size: 14px; font-family: 'DM Sans', sans-serif;
    color: ${COLORS.navy}; outline: none; transition: border-color 0.2s;
    background: ${COLORS.offWhite};
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: ${COLORS.teal}; background: white;
  }
  .form-group textarea { resize: vertical; min-height: 100px; }

  .appt-types { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .appt-type {
    border: 2px solid ${COLORS.gray100}; border-radius: 12px;
    padding: 18px 20px; cursor: pointer; transition: all 0.2s;
    background: ${COLORS.offWhite};
  }
  .appt-type:hover { border-color: ${COLORS.tealLight}; background: ${COLORS.tealPale}; }
  .appt-type.selected { border-color: ${COLORS.teal}; background: ${COLORS.tealPale}; }
  .appt-type h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .appt-type p { font-size: 12px; color: ${COLORS.gray500}; }

  .time-slots { display: flex; flex-wrap: wrap; gap: 10px; }
  .time-slot {
    padding: 10px 18px; border: 1.5px solid ${COLORS.gray300};
    border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s; color: ${COLORS.gray700};
    background: ${COLORS.offWhite};
  }
  .time-slot:hover { border-color: ${COLORS.teal}; color: ${COLORS.teal}; }
  .time-slot.selected { border-color: ${COLORS.teal}; background: ${COLORS.teal}; color: white; }
  .time-slot.unavailable { opacity: 0.35; cursor: not-allowed; }

  .success-box {
    background: ${COLORS.greenLight}; border: 1.5px solid ${COLORS.green};
    border-radius: 16px; padding: 32px; text-align: center;
  }
  .success-box .icon { font-size: 48px; margin-bottom: 16px; }
  .success-box h3 { color: ${COLORS.green}; font-size: 22px; margin-bottom: 8px; }
  .success-box p { color: ${COLORS.gray700}; font-size: 14px; }

  /* PORTAL */
  .portal-layout { display: flex; min-height: calc(100vh - 68px); }
  .portal-sidebar {
    width: 240px; background: ${COLORS.navy}; flex-shrink: 0;
    padding: 32px 0;
  }
  .portal-sidebar-title {
    color: rgba(255,255,255,0.4); font-size: 11px; font-weight: 600;
    letter-spacing: 1.2px; text-transform: uppercase;
    padding: 0 24px; margin-bottom: 8px;
  }
  .portal-nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 24px; color: rgba(255,255,255,0.6);
    cursor: pointer; font-size: 14px; font-weight: 500;
    transition: all 0.2s; border: none; background: none;
    width: 100%; text-align: left;
  }
  .portal-nav-item:hover { color: white; background: rgba(255,255,255,0.06); }
  .portal-nav-item.active {
    color: white; background: rgba(13,115,119,0.25);
    border-right: 3px solid ${COLORS.teal};
  }
  .portal-nav-item .icon { font-size: 16px; }

  .portal-content { flex: 1; padding: 40px; background: ${COLORS.offWhite}; }
  .portal-header { margin-bottom: 32px; }
  .portal-header h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 28px; color: ${COLORS.navy};
  }
  .portal-header p { color: ${COLORS.gray500}; margin-top: 4px; font-size: 14px; }

  .card {
    background: white; border: 1px solid ${COLORS.gray100};
    border-radius: 16px; padding: 28px; margin-bottom: 20px;
  }
  .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: ${COLORS.navy}; }

  .appt-item {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 0; border-bottom: 1px solid ${COLORS.gray100};
  }
  .appt-item:last-child { border-bottom: none; }
  .appt-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: ${COLORS.teal}; flex-shrink: 0;
  }
  .appt-dot.past { background: ${COLORS.gray300}; }
  .appt-info { flex: 1; }
  .appt-info h4 { font-size: 14px; font-weight: 600; }
  .appt-info p { font-size: 13px; color: ${COLORS.gray500}; margin-top: 2px; }
  .appt-badge {
    font-size: 11px; font-weight: 600; padding: 4px 10px;
    border-radius: 20px;
  }
  .badge-upcoming { background: ${COLORS.tealPale}; color: ${COLORS.teal}; }
  .badge-past { background: ${COLORS.gray100}; color: ${COLORS.gray500}; }

  .file-upload-area {
    border: 2px dashed ${COLORS.gray300}; border-radius: 14px;
    padding: 40px; text-align: center; cursor: pointer;
    transition: all 0.2s; background: ${COLORS.offWhite};
  }
  .file-upload-area:hover { border-color: ${COLORS.teal}; background: ${COLORS.tealPale}; }
  .file-upload-area .upload-icon { font-size: 36px; margin-bottom: 12px; }
  .file-upload-area h4 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .file-upload-area p { font-size: 13px; color: ${COLORS.gray500}; }

  .file-list { margin-top: 20px; }
  .file-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; background: white; border: 1px solid ${COLORS.gray100};
    border-radius: 10px; margin-bottom: 10px;
  }
  .file-icon { font-size: 22px; }
  .file-name { flex: 1; font-size: 14px; font-weight: 500; }
  .file-meta { font-size: 12px; color: ${COLORS.gray500}; }
  .file-del {
    color: ${COLORS.gray500}; cursor: pointer; font-size: 16px;
    border: none; background: none; padding: 4px 8px;
    transition: color 0.2s;
  }
  .file-del:hover { color: ${COLORS.red}; }

  .message-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
  .message-item {
    display: flex; gap: 14px; align-items: flex-start;
  }
  .message-item.sent { flex-direction: row-reverse; }
  .msg-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: ${COLORS.teal}; color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; flex-shrink: 0;
  }
  .msg-avatar.patient { background: ${COLORS.navyLight}; }
  .msg-bubble {
    max-width: 420px; padding: 14px 18px;
    border-radius: 16px; font-size: 14px; line-height: 1.5;
  }
  .msg-bubble.doctor {
    background: white; border: 1px solid ${COLORS.gray100};
    border-radius: 4px 16px 16px 16px;
  }
  .msg-bubble.patient {
    background: ${COLORS.teal}; color: white;
    border-radius: 16px 4px 16px 16px;
  }
  .msg-time { font-size: 11px; color: ${COLORS.gray500}; margin-top: 5px; }
  .msg-time.sent { text-align: right; }

  .msg-compose {
    display: flex; gap: 12px; align-items: flex-end;
  }
  .msg-compose textarea {
    flex: 1; border: 1.5px solid ${COLORS.gray300}; border-radius: 12px;
    padding: 12px 16px; font-size: 14px; font-family: 'DM Sans', sans-serif;
    resize: none; outline: none; transition: border-color 0.2s; min-height: 52px;
  }
  .msg-compose textarea:focus { border-color: ${COLORS.teal}; }

  /* LOGIN */
  .login-page {
    min-height: calc(100vh - 68px);
    display: flex; align-items: center; justify-content: center;
    background: ${COLORS.offWhite};
  }
  .login-card {
    background: white; border: 1px solid ${COLORS.gray100};
    border-radius: 24px; padding: 52px 48px;
    width: 100%; max-width: 440px;
    box-shadow: 0 20px 60px rgba(10,22,40,0.08);
  }
  .login-card h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 30px; margin-bottom: 6px;
  }
  .login-card p { color: ${COLORS.gray500}; font-size: 14px; margin-bottom: 36px; }
  .login-form { display: flex; flex-direction: column; gap: 18px; }
  .forgot { font-size: 13px; color: ${COLORS.teal}; cursor: pointer; text-align: right; margin-top: -8px; }
  .register-link { text-align: center; font-size: 13px; color: ${COLORS.gray500}; margin-top: 20px; }
  .register-link span { color: ${COLORS.teal}; cursor: pointer; font-weight: 600; }

  /* CONTACT */
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
  .contact-info h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 38px; margin-bottom: 16px;
  }
  .contact-info p { color: ${COLORS.gray500}; font-size: 15px; line-height: 1.7; margin-bottom: 36px; }
  .contact-detail {
    display: flex; align-items: flex-start; gap: 16px;
    margin-bottom: 24px;
  }
  .contact-detail-icon {
    width: 44px; height: 44px; background: ${COLORS.tealPale};
    border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-size: 20px; flex-shrink: 0;
  }
  .contact-detail h4 { font-size: 13px; font-weight: 600; color: ${COLORS.gray500}; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
  .contact-detail p { color: ${COLORS.navy}; font-size: 15px; margin: 0; }

  .footer {
    background: ${COLORS.navy}; color: white; padding: 48px 80px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .footer-logo { font-family: 'DM Serif Display', serif; font-size: 20px; }
  .footer p { color: rgba(255,255,255,0.4); font-size: 13px; margin-top: 6px; }
  .footer-links { display: flex; gap: 24px; }
  .footer-link { color: rgba(255,255,255,0.5); font-size: 13px; cursor: pointer; }
  .footer-link:hover { color: white; }

  .divider { height: 1px; background: ${COLORS.gray100}; margin: 0; }

  .alert {
    padding: 14px 18px; border-radius: 10px;
    font-size: 14px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .alert-error { background: #FEE8E8; color: ${COLORS.red}; border: 1px solid #FBBCBC; }
  .alert-success { background: ${COLORS.greenLight}; color: ${COLORS.green}; border: 1px solid #A8D5B8; }
  /* --- Added: links styled as buttons, mobile nav, new sections --- */
  a.nav-link, a.nav-btn, a.btn-primary, a.btn-secondary { text-decoration: none; display: inline-block; text-align: center; }
  .btn-secondary {
    background: white; color: ${COLORS.teal};
    border: 1.5px solid ${COLORS.teal};
    padding: 13px 26px; border-radius: 10px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-secondary:hover { background: ${COLORS.tealPale}; }
  .btn-block { display: block; width: 100%; margin-bottom: 12px; }
  .nav-toggle {
    display: none; background: none; border: none; color: white;
    font-size: 26px; cursor: pointer; padding: 4px 8px;
  }
  .fine { font-size: 13px; color: ${COLORS.gray500}; line-height: 1.6; margin-top: 8px; }
  .appt-type.static { cursor: default; }
  .booking-container .appt-type p, .booking-container .fine { margin-bottom: 0; }
  .appt-type.static:hover { border-color: ${COLORS.gray100}; background: ${COLORS.offWhite}; }
  .bring-list { padding-left: 20px; color: ${COLORS.gray700}; font-size: 15px; line-height: 1.9; }
  .records-box { margin-top: 36px; padding-top: 36px; border-top: 1px solid ${COLORS.gray100}; }
  .records-box p { font-size: 14px; color: ${COLORS.gray700}; line-height: 1.7; margin-bottom: 16px; }
  .records-box a:not(.btn-primary) { color: ${COLORS.teal}; font-weight: 600; }
  .testimonials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 36px; }
  .testimonial {
    background: white; border: 1px solid ${COLORS.gray100}; border-radius: 16px;
    padding: 28px; margin: 0;
  }
  .testimonial blockquote { font-size: 15px; line-height: 1.7; color: ${COLORS.gray700}; margin-bottom: 16px; }
  .testimonial figcaption { font-size: 13px; font-weight: 600; color: ${COLORS.navy}; }
  .review-cta { display: flex; gap: 14px; flex-wrap: wrap; }
  .map-wrap { border-radius: 14px; overflow: hidden; border: 1px solid ${COLORS.gray100}; margin-bottom: 20px; }
  .map-wrap iframe { width: 100%; height: 280px; border: 0; display: block; }
  .contact-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .contact-actions a { padding: 13px 10px; font-size: 14px; }
  .contact-detail a { color: ${COLORS.navy}; text-decoration: none; }
  .contact-detail a:hover { color: ${COLORS.teal}; }
  .footer a.footer-link, .footer button.footer-link { text-decoration: none; background: none; border: none; font-family: inherit; padding: 0; }
  .doctor-card { display: grid; grid-template-columns: 320px 1fr; }
  .doctor-photo { padding: 32px 0 0 32px; }
  .doctor-img { width: 100%; height: auto; display: block; border-radius: 14px; }
  .doctor-body { padding: 48px 52px; }
  .doctor-stats { display: flex; gap: 32px; flex-wrap: wrap; }

    setFiles([...files, {

                    />
                  </div>
                  <div style={{ padding: "48px 52px" }}>
                    <div style={{
                      display: "inline-block", background: COLORS.tealPale,
                      color: COLORS.teal, fontSize: 12, fontWeight: 600,
                      letterSpacing: "0.8px", textTransform: "uppercase",
                      padding: "5px 14px", borderRadius: 20, marginBottom: 16
                    }}>Lead Physician & Founder</div>
                    <h2 style={{
                      fontFamily: "'DM Serif Display', serif",
                      fontSize: 38, color: COLORS.navy, marginBottom: 6
                    }}>Dr. Nisa Masood, MD</h2>
                    <p style={{ color: COLORS.teal, fontWeight: 600, fontSize: 15, marginBottom: 28 }}>
                      Board-Certified Internal Medicine Physician · 20+ Years of Experience
                    </p>
                    <p style={{ color: COLORS.gray700, fontSize: 15, lineHeight: 1.8, marginBottom: 18 }}>
                      Dr. Nisa Masood is an American Board of Internal Medicine certified physician with over 20 years of clinical experience spanning both the United States and Singapore. Trained at the prestigious Howard University Hospital in Washington D.C. and St. Agnes Healthcare in Baltimore, she brings a rare breadth of expertise — from hospital medicine in major tertiary centers to primary care for patients of all ages, including geriatric and neonatal care.
                    </p>
                    <p style={{ color: COLORS.gray700, fontSize: 15, lineHeight: 1.8, marginBottom: 18 }}>
                      Her clinical career has spanned high-volume inpatient settings — including Inova Fairfax and Inova Fair Oaks Hospitals in Northern Virginia, and Sengkang General Hospital in Singapore — where she managed 30+ patients daily, supervised Georgetown and George Washington University medical residents, and performed advanced procedures including central line placements, lumbar punctures, and paracentesis. In outpatient settings, she has served practices of 1,500+ patients, consistently earning high marks for patient satisfaction and quality of care.
                    </p>
                    <p style={{ color: COLORS.gray700, fontSize: 15, lineHeight: 1.8, marginBottom: 32 }}>
                      Beyond direct patient care, Dr. Masood has been a leader in healthcare innovation — co-leading Singapore's National Electronic Health Records initiative and pioneering value-based care programs. She founded Active Medical Care to bring this global experience home to Fairfax, delivering compassionate, evidence-based medicine with a personal touch that patients genuinely feel.
                    </p>
                    <div style={{ display: "flex", gap: 32 }}>
                      {[
                        { num: "20+", label: "Years of Clinical Experience" },
                        { num: "1,500+", label: "Active Patient Practice" },
                        { num: "4", label: "State Medical Licenses" },
                      ].map(s => (
                        <div key={s.label}>
                          <div style={{ fontFamily: "'DM Serif Display', serif", fontSize: 28, color: COLORS.teal }}>{s.num}</div>
                          <div style={{ fontSize: 12, color: COLORS.gray500, marginTop: 2 }}>{s.label}</div>
                        </div>
                      ))}
                    </div>

                    {/* Patient Document Upload */}
                    <div style={{
                      marginTop: 36, paddingTop: 36,
                      borderTop: `1px solid ${COLORS.gray100}`
                    }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                        <span style={{ fontSize: 20 }}>📎</span>
                        <h3 style={{ fontSize: 16, fontWeight: 700, color: COLORS.navy }}>Send Documents to Dr. Masood</h3>
                      </div>
                      <p style={{ fontSize: 14, color: COLORS.gray500, marginBottom: 20 }}>
                        Upload lab results, insurance cards, referrals, or any records you'd like Dr. Masood to review before your visit. Your email client will open so you can attach the files directly.
                      </p>

                      {/* Patient info fields */}
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 16 }}>
                        <div className="form-group">
                          <label>Your Name</label>
                          <input type="text" placeholder="Jane Smith"
                            value={senderName} onChange={e => setSenderName(e.target.value)} />
                        </div>
                        <div className="form-group">
                          <label>Your Email</label>
                          <input type="email" placeholder="you@example.com"
                            value={senderEmail} onChange={e => setSenderEmail(e.target.value)} />
                        </div>
                        <div className="form-group" style={{ gridColumn: "1 / -1" }}>
                          <label>Message / Notes for Dr. Masood (optional)</label>
                          <textarea placeholder="e.g. These are my recent lab results from March. Please review before my appointment on June 5."
                            rows={3} value={senderNote} onChange={e => setSenderNote(e.target.value)}
                            style={{ resize: "vertical" }} />
                        </div>
                      </div>

                      {/* Upload area */}
                      <label htmlFor="team-upload" style={{ cursor: "pointer", display: "block" }}>
                        <div style={{
                          border: `2px dashed ${pubUploadFiles.length > 0 ? COLORS.teal : COLORS.gray300}`,
                          borderRadius: 14, padding: "28px 24px", textAlign: "center",
                          background: pubUploadFiles.length > 0 ? COLORS.tealPale : COLORS.offWhite,
                          transition: "all 0.2s"
                        }}>
                          <div style={{ fontSize: 32, marginBottom: 10 }}>📤</div>
                          <p style={{ fontWeight: 600, fontSize: 15, marginBottom: 4, color: COLORS.navy }}>Click to select files to attach</p>
                          <p style={{ fontSize: 13, color: COLORS.gray500 }}>PDF, JPG, PNG — up to 25 MB each</p>
                        </div>
                      </label>
                      <input id="team-upload" type="file" style={{ display: "none" }} multiple
                        accept=".pdf,.jpg,.jpeg,.png"
                        onChange={e => {
                          setPubUploadSent(false);
                          const newFiles = Array.from(e.target.files).map(f => ({
                            id: Date.now() + Math.random(),
                            name: f.name,
                            size: f.size < 1024 * 1024
                              ? (f.size / 1024).toFixed(0) + " KB"
                              : (f.size / 1024 / 1024).toFixed(1) + " MB",
                            date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }),
                            icon: f.type.includes("pdf") ? "📄" : "🖼️"
                          }));
                          setPubUploadFiles(prev => [...prev, ...newFiles]);
                        }}
                      />

                      {/* File list */}
                      {pubUploadFiles.length > 0 && (
                        <div style={{ marginTop: 16 }}>
                          {pubUploadFiles.map(f => (
                            <div key={f.id} style={{
                              display: "flex", alignItems: "center", gap: 14,
                              padding: "12px 16px", background: "white",
                              border: `1px solid ${COLORS.gray100}`, borderRadius: 10, marginBottom: 8
                            }}>
                              <span style={{ fontSize: 20 }}>{f.icon}</span>
                              <div style={{ flex: 1 }}>
                                <div style={{ fontSize: 14, fontWeight: 500, color: COLORS.navy }}>{f.name}</div>
                                <div style={{ fontSize: 12, color: COLORS.gray500 }}>{f.size} · {f.date}</div>
                              </div>
                              <button onClick={() => setPubUploadFiles(prev => prev.filter(x => x.id !== f.id))}
                                style={{ border: "none", background: "none", color: COLORS.gray500, cursor: "pointer", fontSize: 16, padding: "4px 8px" }}>✕</button>
                            </div>
                          ))}

                          {pubUploadSent ? (
                            <div style={{
                              background: COLORS.greenLight, border: `1.5px solid ${COLORS.green}`,
                              borderRadius: 12, padding: "16px 20px", display: "flex",
                              alignItems: "center", gap: 12, marginTop: 12
                            }}>
                              <span style={{ fontSize: 22 }}>✅</span>
                              <div>
                                <div style={{ fontWeight: 600, color: COLORS.green, fontSize: 14 }}>Your email client has opened!</div>
                                <div style={{ fontSize: 13, color: COLORS.gray700, marginTop: 2 }}>
                                  Please attach your files and hit Send. Dr. Masood's office will review them before your appointment.
                                </div>
                              </div>
                            </div>
                          ) : (
                            <button className="btn-primary" style={{ width: "100%", padding: "13px", marginTop: 12 }}
                              onClick={() => {
                                const to = "activemedicalcare78@gmail.com";
                                const subject = encodeURIComponent(
                                  `Patient Documents${senderName ? " from " + senderName : ""}`
                                );
                                const fileList = pubUploadFiles.map(f => `  • ${f.name} (${f.size})`).join("\n");
                                const body = encodeURIComponent(
                                  `Hello Dr. Masood,\n\n` +
                                  `${senderName ? "Patient: " + senderName + "\n" : ""}` +
                                  `${senderEmail ? "Email: " + senderEmail + "\n" : ""}` +
                                  `\nI am sending the following document(s) for your review:\n\n${fileList}` +
                                  `${senderNote ? "\n\nAdditional notes:\n" + senderNote : ""}` +
                                  `\n\nPlease find the files attached to this email.\n\nThank you.`
                                );
                                window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
                                setPubUploadSent(true);
                              }}>
                              📧 Open Email to Send {pubUploadFiles.length} Document{pubUploadFiles.length > 1 ? "s" : ""} →
                            </button>
                          )}
                        </div>
                      )}

                      <div style={{
                        marginTop: 16, padding: "12px 16px",
                        background: COLORS.gray100, borderRadius: 10,
                        fontSize: 12, color: COLORS.gray500, lineHeight: 1.6
                      }}>
                        💡 <strong>How it works:</strong> Clicking the button opens your email app with Dr. Masood's address pre-filled. Attach your selected files and hit Send. Your documents go directly to <strong>activemedicalcare78@gmail.com</strong>.
                      </div>
                    </div>

                  </div>
                </div>
              </div>
            </div>
          </div>

        {/* BOOKING */}
        {page === "booking" && (
          <div style={{ background: COLORS.offWhite, minHeight: "calc(100vh - 68px)" }}>
            <div className="booking-container">
              <h2>Book an Appointment</h2>
              <p>Schedule a visit with Dr. Masood. Office hours are Monday–Friday, 9:00 AM – 5:00 PM. Most appointments available within 48 hours.</p>

              {bookingDone ? (
                <div className="success-box">
                  <div className="icon">✅</div>
                  <h3>Appointment Confirmed!</h3>
                  <p style={{ margin: "8px 0 0" }}>
                    Your <strong>{apptType}</strong> on <strong>{apptDate}</strong> at <strong>{apptTime}</strong> has been booked.<br />
                    A confirmation email will be sent to you shortly.
                  </p>
                  <button className="btn-primary" style={{ marginTop: 24 }} onClick={() => { setBookingDone(false); setBookingStep(1); setApptType(null); setApptDate(""); setApptTime(null); }}>
                    Book Another
                  </button>
                </div>
              ) : (
                <>
                  {/* Step 1 */}
                  <div className="form-step">
                    <h3>Step 1 — Visit Type</h3>
                    <div className="appt-types">
                      {[
                        { label: "Annual Physical", desc: "Comprehensive wellness exam" },
                        { label: "Sick Visit", desc: "Illness or acute concern" },
                        { label: "Follow-up", desc: "Review of prior treatment" },
                        { label: "New Patient", desc: "First visit to our practice" },
                      ].map(t => (
                        <div key={t.label} className={`appt-type ${apptType === t.label ? "selected" : ""}`} onClick={() => setApptType(t.label)}>
                          <h4>{t.label}</h4>
                          <p>{t.desc}</p>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Step 2 */}
                  <div className="form-step">
                    <h3>Step 2 — Select Date & Time</h3>
                    <div className="form-grid">
                      <div className="form-group">
                        <label>Preferred Date</label>
                        <input type="date" value={apptDate} onChange={e => setApptDate(e.target.value)} min={new Date().toISOString().split("T")[0]} />
                      </div>
                      <div className="form-group">
                        <label>Physician</label>
                        <select>
                          <option>Dr. Nisa Masood, MD</option>
                        </select>
                      </div>
                    </div>
                    <div style={{ marginTop: 20 }}>
                      <label style={{ fontSize: 13, fontWeight: 600, color: COLORS.gray700, display: "block", marginBottom: 12 }}>Available Times</label>
                      <div className="time-slots">
                        {TIME_SLOTS.map(t => (
                          <div key={t} className={`time-slot ${apptTime === t ? "selected" : ""} ${UNAVAILABLE.includes(t) ? "unavailable" : ""}`}
                            onClick={() => !UNAVAILABLE.includes(t) && setApptTime(t)}>
                            {t}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Step 3 */}
                  <div className="form-step">
                    <h3>Step 3 — Patient Information</h3>
                    <div className="form-grid">
                      <div className="form-group">
                        <label>First Name</label>
                        <input type="text" placeholder="John" />
                      </div>
                      <div className="form-group">
                        <label>Last Name</label>
                        <input type="text" placeholder="Smith" />
                      </div>
                      <div className="form-group">
                        <label>Date of Birth</label>
                        <input type="date" />
                      </div>
                      <div className="form-group">
                        <label>Phone Number</label>
                        <input type="tel" placeholder="(555) 000-0000" />
                      </div>
                      <div className="form-group full">
                        <label>Email Address</label>
                        <input type="email" placeholder="john@example.com" />
                      </div>
                      <div className="form-group full">
                        <label>Insurance Provider</label>
                        <select>
                          <option>Aetna</option>
                          <option>BlueCross BlueShield</option>
                          <option>Cigna</option>
                          <option>UnitedHealthcare</option>
                          <option>Kaiser Permanente</option>
                          <option>Medicare</option>
                          <option>Medicaid</option>
                          <option>Self-Pay</option>
                        </select>
                      </div>
                      <div className="form-group full">
                        <label>Reason for Visit / Notes</label>
                        <textarea placeholder="Please describe your symptoms or reason for the visit..." />
                      </div>
                    </div>
                  </div>

                  <button className="btn-primary" style={{ width: "100%", padding: "16px" }}
                    onClick={submitBooking}
                    disabled={!apptType || !apptDate || !apptTime}>
                    Confirm Appointment →
                  </button>
                </>
              )}
            </div>
          </div>
        )}

        {/* LOGIN */}
        {page === "login" && (
          <div className="login-page">
            <div className="login-card">
              <h2>Patient Portal Login</h2>
              <p>Access your appointments, records, and messages.</p>
              {loginError && <div className="alert alert-error">⚠️ {loginError}</div>}
              <div className="login-form">
                <div className="form-group">
                  <label>Email Address</label>
                  <input type="email" placeholder="patient@demo.com" value={email} onChange={e => setEmail(e.target.value)} />
                </div>
                <div className="form-group">
                  <label>Password</label>
                  <input type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && handleLogin()} />
                </div>
                <div className="forgot">Forgot password?</div>
                <button className="btn-primary" style={{ padding: "14px" }} onClick={handleLogin}>Sign In to Portal</button>
              </div>
              <p style={{ textAlign: "center", fontSize: 12, color: COLORS.gray500, marginTop: 16 }}>Demo: patient@demo.com / demo123</p>
              <div className="register-link">New patient? <span onClick={() => setPage("booking")}>Register here</span></div>
            </div>
          </div>
        )}

        {/* PATIENT PORTAL */}
        {page === "portal" && loggedIn && (
          <div className="portal-layout">
            <aside className="portal-sidebar">
              <div className="portal-sidebar-title" style={{ marginBottom: 16 }}>Patient Portal</div>
              {[
                { id: "dashboard", icon: "🏠", label: "Dashboard" },
                { id: "appointments", icon: "📅", label: "Appointments" },
                { id: "messages", icon: "💬", label: "Message Doctor" },
                { id: "files", icon: "📁", label: "My Files" },
                { id: "profile", icon: "👤", label: "My Profile" },
              ].map(item => (
                <button key={item.id} className={`portal-nav-item ${portalTab === item.id ? "active" : ""}`}
                  onClick={() => setPortalTab(item.id)}>
                  <span className="icon">{item.icon}</span>
                  {item.label}
                </button>
              ))}
              <div style={{ marginTop: "auto", padding: "24px 24px 0" }}>
                <button className="portal-nav-item" onClick={handleLogout} style={{ color: "rgba(255,100,100,0.7)" }}>
                  <span className="icon">🚪</span> Sign Out
                </button>
              </div>
            </aside>

            <main className="portal-content">

              {/* DASHBOARD */}
              {portalTab === "dashboard" && (
                <>
                  <div className="portal-header">
                    <h2>Welcome back, John 👋</h2>
                    <p>Here's a summary of your health account.</p>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 20 }}>
                    {[
                      { label: "Next Appointment", value: "May 20, 2026", sub: "Annual Physical — 10:00 AM", color: COLORS.teal },
                      { label: "Unread Messages", value: "1", sub: "From Dr. Masood", color: COLORS.navy },
                      { label: "Files Uploaded", value: `${files.length}`, sub: "Medical records", color: COLORS.tealLight },
                      { label: "Last Visit", value: "Mar 15, 2026", sub: "Blood Work Review", color: COLORS.gray500 },
                    ].map(stat => (
                      <div key={stat.label} className="card" style={{ marginBottom: 0 }}>
                        <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.gray500, textTransform: "uppercase", letterSpacing: "0.6px", marginBottom: 8 }}>{stat.label}</div>
                        <div style={{ fontSize: 28, fontWeight: 700, color: stat.color, fontFamily: "'DM Serif Display', serif" }}>{stat.value}</div>
                        <div style={{ fontSize: 13, color: COLORS.gray500, marginTop: 4 }}>{stat.sub}</div>
                      </div>
                    ))}
                  </div>
                  <div className="card">
                    <h3>Upcoming Appointments</h3>
                    {APPOINTMENTS.filter(a => a.status === "upcoming").map(a => (
                      <div className="appt-item" key={a.id}>
                        <div className="appt-dot" />
                        <div className="appt-info">
                          <h4>{a.type}</h4>
                          <p>{a.date} at {a.time} — {a.dr}</p>
                        </div>
                        <span className="appt-badge badge-upcoming">Upcoming</span>
                      </div>
                    ))}
                    <button className="btn-primary" style={{ marginTop: 20 }} onClick={() => setPage("booking")}>Book New Appointment</button>
                  </div>
                </>
              )}

              {/* APPOINTMENTS */}
              {portalTab === "appointments" && (
                <>
                  <div className="portal-header">
                    <h2>My Appointments</h2>
                    <p>View upcoming and past visits.</p>
                  </div>
                  <div className="card">
                    <h3>Upcoming</h3>
                    {APPOINTMENTS.filter(a => a.status === "upcoming").map(a => (
                      <div className="appt-item" key={a.id}>
                        <div className="appt-dot" />
                        <div className="appt-info">
                          <h4>{a.type}</h4>
                          <p>{a.date} at {a.time} — {a.dr}</p>
                        </div>
                        <span className="appt-badge badge-upcoming">Upcoming</span>
                      </div>
                    ))}
                  </div>
                  <div className="card">
                    <h3>Past Visits</h3>
                    {APPOINTMENTS.filter(a => a.status === "past").map(a => (
                      <div className="appt-item" key={a.id}>
                        <div className="appt-dot past" />
                        <div className="appt-info">
                          <h4>{a.type}</h4>
                          <p>{a.date} at {a.time} — {a.dr}</p>
                        </div>
                        <span className="appt-badge badge-past">Completed</span>
                      </div>
                    ))}
                  </div>
                  <button className="btn-primary" onClick={() => setPage("booking")}>Book New Appointment</button>
                </>
              )}

              {/* MESSAGES */}
              {portalTab === "messages" && (
                <>
                  <div className="portal-header">
                    <h2>Message Your Doctor</h2>
                    <p>Secure messaging with your care team. Responses within 1 business day.</p>
                  </div>
                  <div className="card">
                    <h3>Dr. Nisa Masood, MD</h3>
                    <div className="message-list">
                      {messages.map(m => (
                        <div key={m.id} className={`message-item ${m.from === "patient" ? "sent" : ""}`}>
                          <div className={`msg-avatar ${m.from === "patient" ? "patient" : ""}`}>
                            {m.from === "doctor" ? "NM" : "JD"}
                          </div>
                          <div>
                            <div className={`msg-bubble ${m.from}`}>{m.text}</div>
                            <div className={`msg-time ${m.from === "patient" ? "sent" : ""}`}>{m.time}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                    <div className="msg-compose">
                      <textarea
                        placeholder="Type a message to your doctor..."
                        value={newMsg}
                        onChange={e => setNewMsg(e.target.value)}
                        onKeyDown={e => e.key === "Enter" && !e.shiftKey && (e.preventDefault(), handleSendMessage())}
                        rows={2}
                      />
                      <button className="btn-primary" style={{ padding: "12px 20px", flexShrink: 0 }} onClick={handleSendMessage}>Send →</button>
                    </div>
                  </div>
                </>
              )}

              {/* FILES */}
              {portalTab === "files" && (
                <>
                  <div className="portal-header">
                    <h2>My Files</h2>
                    <p>Upload insurance cards, lab results, referrals, and other documents.</p>
                  </div>
                  <div className="card">
                    <label htmlFor="file-input" style={{ cursor: "pointer", display: "block" }}>
                      <div className="file-upload-area">
                        <div className="upload-icon">📤</div>
                        <h4>Click to upload a file</h4>
                        <p>PDF, JPG, PNG up to 25 MB</p>
                      </div>
                    </label>
                    <input id="file-input" type="file" style={{ display: "none" }} onChange={handleFileUpload} accept=".pdf,.jpg,.jpeg,.png" />
                  </div>
                  <div className="card">
                    <h3>Uploaded Documents ({files.length})</h3>
                    <div className="file-list">
                      {files.map(f => (
                        <div className="file-item" key={f.id}>
                          <span className="file-icon">{f.icon}</span>
                          <div className="file-name">{f.name}</div>
                          <div className="file-meta">{f.size} · {f.date}</div>
                          <button className="file-del" onClick={() => setFiles(files.filter(x => x.id !== f.id))}>✕</button>
                        </div>
                      ))}
                    </div>
                  </div>
                </>
              )}

              {/* PROFILE */}
              {portalTab === "profile" && (
                <>
                  <div className="portal-header">
                    <h2>My Profile</h2>
                    <p>Manage your personal and insurance information.</p>
                  </div>
                  <div className="card">
                    <h3>Personal Information</h3>
                    <div className="form-grid">
                      <div className="form-group">
                        <label>First Name</label>
                        <input type="text" defaultValue="John" />
                      </div>
                      <div className="form-group">
                        <label>Last Name</label>
                        <input type="text" defaultValue="Doe" />
                      </div>
                      <div className="form-group">
                        <label>Date of Birth</label>
                        <input type="date" defaultValue="1985-06-14" />
                      </div>
                      <div className="form-group">
                        <label>Phone</label>
                        <input type="tel" defaultValue="(703) 620-6221" />
                      </div>
                      <div className="form-group full">
                        <label>Email</label>
                        <input type="email" defaultValue="patient@demo.com" />
                      </div>
                      <div className="form-group full">
                        <label>Address</label>
                        <input type="text" defaultValue="123 Maple Street, Fairfax, VA 22030" />
                      </div>
                    </div>
                  </div>
                  <div className="card">
                    <h3>Insurance Information</h3>
                    <div className="form-grid">
                      <div className="form-group">
                        <label>Insurance Provider</label>
                        <select defaultValue="Aetna">
                          <option>Aetna</option>
                          <option>BlueCross BlueShield</option>
                          <option>Cigna</option>
                          <option>UnitedHealthcare</option>
                        </select>
                      </div>
                      <div className="form-group">
                        <label>Member ID</label>
                        <input type="text" defaultValue="AET-2049-8821" />
                      </div>
                      <div className="form-group">
                        <label>Group Number</label>
                        <input type="text" defaultValue="GRP-00443" />
                      </div>
                      <div className="form-group">
                        <label>Policy Holder</label>
                        <input type="text" defaultValue="John Doe" />
                      </div>
                    </div>
                  </div>
                  <button className="btn-primary">Save Changes</button>
                </>
              )}

            </main>
          </div>
        )}

        {/* CONTACT */}
        {page === "contact" && (
          <div className="section">
            <div className="contact-grid">
              <div className="contact-info">
                <h2>Get In Touch</h2>
                <p>We're here to help. Reach out by phone, email, or visit us at our office. New patients are always welcome.</p>
                {[
                  { icon: "📍", label: "Address", text: "3930 Pender Dr, Suite 230\nFairfax, VA 22030" },
                  { icon: "📞", label: "Phone", text: "(703) 620-6221" },
                  { icon: "📞", label: "Phone 2", text: "(571) 500-8547" },
                  { icon: "✉️", label: "Email", text: "info@activemedicalcare.com" },
                ].map(d => (
                  <div className="contact-detail" key={d.label}>
                    <div className="contact-detail-icon">{d.icon}</div>
                    <div>
                      <h4>{d.label}</h4>
                      <p style={{ whiteSpace: "pre-line" }}>{d.text}</p>
                    </div>
                  </div>
                ))}
              </div>
              <div>
                <div className="form-step" style={{ background: "white" }}>
                  <h3>Send Us a Message</h3>
                  <div className="form-grid">
                    <div className="form-group">
                      <label>Your Name</label>
                      <input type="text" placeholder="John Smith" />
                    </div>
                    <div className="form-group">
                      <label>Phone</label>
                      <input type="tel" placeholder="(555) 000-0000" />
                    </div>
                    <div className="form-group full">
                      <label>Email</label>
                      <input type="email" placeholder="you@example.com" />
                    </div>
                    <div className="form-group full">
                      <label>Subject</label>
                      <select>
                        <option>General Inquiry</option>
                        <option>New Patient Registration</option>
                        <option>Prescription Refill</option>
                        <option>Medical Records Request</option>
                        <option>Billing Question</option>
                        <option>Other</option>
                      </select>
                    </div>
                    <div className="form-group full">
                      <label>Message</label>
                      <textarea placeholder="How can we help you?" />
                    </div>
                  </div>
                  <button className="btn-primary" style={{ width: "100%", padding: "14px", marginTop: 16 }}>Send Message</button>
                </div>
              </div>
            </div>
          </div>
        )}

      </div>
    </>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
